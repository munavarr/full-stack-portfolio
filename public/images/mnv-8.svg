<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
<defs>
  <linearGradient id="flowA" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#4C2BFF"/><stop offset=".28" stop-color="#A34CFF"/>
    <stop offset=".52" stop-color="#20D7E8"/><stop offset=".72" stop-color="#FF6FAE"/>
    <stop offset="1" stop-color="#FFB45A"/>
  </linearGradient>
  <linearGradient id="flowB" x1="0" y1="1" x2="1" y2="0">
    <stop stop-color="#14D9C4"/><stop offset=".35" stop-color="#477BFF"/>
    <stop offset=".65" stop-color="#D85CFF"/><stop offset="1" stop-color="#FF8B5A"/>
  </linearGradient>
  <linearGradient id="flowC" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#FF9B5C"/><stop offset=".35" stop-color="#FF5FAE"/>
    <stop offset=".65" stop-color="#7C5CFF"/><stop offset="1" stop-color="#43E5D1"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Upper-left cluster -->
<g opacity=".9">
  <path d="M-40 70 C120 10 160 150 285 175 C350 188 395 230 455 300"
        stroke="url(#flowA)" stroke-width="24" stroke-linecap="round"/>
  <path d="M-20 110 C120 65 175 195 300 215 C365 225 405 260 470 325"
        stroke="url(#flowB)" stroke-width="9" stroke-linecap="round"/>
  <path d="M0 145 C125 90 190 225 315 245 C380 255 420 285 485 345"
        stroke="#64E8FF" stroke-width="2" opacity=".9"/>
  <path d="M30 45 C140 80 155 205 280 255 C350 285 400 305 500 330"
        stroke="#FFB15E" stroke-width="2"/>
</g>

<!-- Lower-right cluster -->
<g opacity=".92">
  <path d="M1115 565 C1220 620 1275 680 1360 695 C1470 715 1510 820 1640 805"
        stroke="url(#flowA)" stroke-width="25" stroke-linecap="round"/>
  <path d="M1090 590 C1210 650 1280 710 1370 720 C1480 735 1525 845 1640 835"
        stroke="url(#flowB)" stroke-width="10" stroke-linecap="round"/>
  <path d="M1070 555 C1215 625 1280 675 1380 700 C1490 730 1530 800 1635 785"
        stroke="#5FE7E0" stroke-width="2"/>
  <path d="M1100 625 C1230 690 1300 735 1400 750 C1500 765 1540 850 1635 845"
        stroke="#FF9C65" stroke-width="2"/>
</g>

<!-- Fine strands crossing the diagonal, with a deliberate open center -->
<path d="M20 205 C210 120 285 260 430 315 C500 342 545 370 590 392"
      stroke="url(#flowC)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
<path d="M1010 510 C1080 545 1120 575 1180 610 C1260 655 1310 670 1410 700"
      stroke="url(#flowC)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

<!-- Tiny bridge strands near edges of the center; no thick band through middle -->
<path d="M470 350 C535 370 565 385 610 400" stroke="#B36CFF" stroke-width="2" opacity=".65"/>
<path d="M990 500 C1025 515 1050 530 1090 555" stroke="#58DFF0" stroke-width="2" opacity=".65"/>

<!-- Upper-left code card -->
<g transform="translate(225 145) rotate(-12)">
  <rect width="190" height="108" rx="16" fill="#11152A" fill-opacity=".72" stroke="#8D6CFF" stroke-width="2"/>
  <circle cx="22" cy="20" r="4" fill="#FF5F8F"/>
  <circle cx="36" cy="20" r="4" fill="#FFB45A"/>
  <circle cx="50" cy="20" r="4" fill="#5CE9D0"/>
  <path d="M27 57l18 14-18 14M78 86l23-45M132 57l-18 14 18 14"
        stroke="#A9D9FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 34h48M112 46h34" stroke="#B86CFF" stroke-width="3"/>
</g>

<!-- Lower-right code card -->
<g transform="translate(1320 655) rotate(9)">
  <rect width="190" height="108" rx="16" fill="#11152A" fill-opacity=".72" stroke="#48DCD0" stroke-width="2"/>
  <circle cx="22" cy="20" r="4" fill="#FF5F8F"/>
  <circle cx="36" cy="20" r="4" fill="#FFB45A"/>
  <circle cx="50" cy="20" r="4" fill="#5CE9D0"/>
  <path d="M25 55h62M25 70h92M25 85h50" stroke="#52DDE8" stroke-width="5" stroke-linecap="round"/>
  <path d="M130 54l15 15-15 15M157 84h20" stroke="#D06CFF" stroke-width="4" stroke-linecap="round"/>
</g>

<!-- developer nodes and geometric accents -->
<g filter="url(#glow)">
  <circle cx="145" cy="170" r="9" fill="#55E6D3"/>
  <circle cx="330" cy="275" r="7" fill="#FFB05B"/>
  <circle cx="1260" cy="665" r="8" fill="#B16CFF"/>
  <circle cx="1475" cy="735" r="7" fill="#58E8D4"/>
</g>

<g fill="none" stroke-width="2">
  <polygon points="155,85 175,118 155,151 135,118" stroke="#FFB35D"/>
  <polygon points="1285,580 1304,612 1285,644 1266,612" stroke="#65E6D6"/>
  <circle cx="405" cy="300" r="18" stroke="#A66CFF"/>
  <circle cx="1195" cy="610" r="17" stroke="#FF78AE"/>
</g>

<!-- orbit lines -->
<path d="M75 250 C170 300 260 320 350 290" stroke="#6C7CFF" stroke-width="2" opacity=".65"/>
<path d="M1240 555 C1340 520 1430 555 1515 620" stroke="#D76BFF" stroke-width="2" opacity=".65"/>

<!-- small particles -->
<g>
 <circle cx="285" cy="115" r="3" fill="#FFB45A"/><circle cx="390" cy="330" r="3" fill="#55E8D4"/>
 <circle cx="1280" cy="590" r="3" fill="#FF8BAF"/><circle cx="1510" cy="700" r="3" fill="#A86CFF"/>
 <circle cx="520" cy="365" r="2" fill="#FFFFFF"/><circle cx="1080" cy="535" r="2" fill="#FFFFFF"/>
</g>
</svg>